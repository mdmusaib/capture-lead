name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: |
          rm -rf node_modules
          npm install --include=dev

      - name: Verify React Native installation
        run: |
          node -p "require('react-native/package.json').version"
          test -d node_modules/@react-native/gradle-plugin
          echo "React Native Gradle Plugin directory found"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lead-capture-app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
