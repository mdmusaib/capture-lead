apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react { autolinkLibrariesWithApp() }

android {
  namespace 'com.leadcapture'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId 'com.leadcapture'
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 1
    versionName '1.0'
  }
  buildToolsVersion rootProject.ext.buildToolsVersion
  buildTypes {
    debug { debuggable true }
    release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
  }
  packagingOptions { resources { excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt'] } }
}

dependencies {
  implementation('com.facebook.react:react-android')
  if (hermesEnabled.toBoolean()) { implementation('com.facebook.react:hermes-android') }
}
